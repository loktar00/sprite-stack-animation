<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Step 6: lift, bob, hip height</title>
<link rel="stylesheet" href="step.css">
</head>
<body>
<canvas id="c" width="480" height="300"></canvas>
<p>The swinging foot rises, the hips sink when a planted leg is stretched, and bob twice a stride. <a href="07.html">Next: three dimensions and arms</a></p>
<script src="ik2d.js"></script>
<script src="step.js"></script>
<script>
const THIGH = 7, SHIN = 7, ANKLE = 1.5, STAND = 13.2, S = 9, GROUND = 250;
const STRIDE = 18, DUTY = 0.6, STANCE = DUTY * STRIDE;
const LIFT = 2.4;                       // how high a swinging foot rises
const BOB = 0.35;                       // hips rise and fall, twice a cycle

let body, phase, feet, hipZ, at = null;
function reset() { body = 0; phase = 0; hipZ = STAND; feet = [{ x: 0, z: 0, planted: true, from: 0 }, { x: 0, z: 0, planted: true, from: 0 }]; }
function walk(dist) {
  body += dist; phase = (phase + dist / STRIDE) % 1;
  let far = 0;                                               // how far the furthest planted foot is from under the hip
  for (let i = 0; i < 2; i++) {
    const foot = feet[i], p = (phase + i * 0.5) % 1;
    if (p < DUTY) {
      if (!foot.planted) { foot.planted = true; foot.x = body + STANCE / 2 - p * STRIDE; }
      foot.z = 0; far = Math.max(far, Math.abs(foot.x - body));
    } else {
      if (foot.planted) { foot.planted = false; foot.from = foot.x; }
      const u = (p - DUTY) / (1 - DUTY), land = body + (1 - p) * STRIDE + STANCE / 2;
      foot.x = foot.from + (land - foot.from) * Step.ease(u);
      foot.z = LIFT * Math.sin(Math.PI * u);                 // new: the swing is an arc
    }
  }
  // new: hip height is solved, not animated. As high as standing allows, but a planted foot must stay in reach.
  const reach = THIGH + SHIN - 0.3, most = ANKLE + Math.sqrt(Math.max(1, reach * reach - far * far));
  hipZ += (Math.min(STAND, most) - hipZ) * 0.23; if (hipZ > most) hipZ = most;
}

Step.run(240, function (ctx, f) {
  if (at === null || f < at) { reset(); at = -240; }
  for (; at < f; at++) walk(STRIDE / 80);
  const px = function (x, z) { return [240 + (x - body) * S, GROUND - z * S]; };
  const pelvis = [body, hipZ - BOB * Math.cos(2 * Step.TAU * phase)];          // new: bob

  Step.line([0, GROUND], [480, GROUND], '#40374c');
  for (let m = Math.floor((body - 30) / 3) * 3; m < body + 30; m += 3) Step.line(px(m, 0), px(m, -0.5), '#40374c');
  ctx.setLineDash([3, 4]); Step.line(px(body - 12, STAND), px(body + 12, STAND), '#40374c'); ctx.setLineDash([]);   // standing hip height, for comparison
  for (let i = 1; i >= 0; i--) {
    const foot = feet[i], ankle = [foot.x, foot.z + ANKLE], knee = solveKnee(pelvis, ankle, THIGH, SHIN, [1, 0]), col = i ? Step.DIM : Step.INK;
    Step.line(px(pelvis[0], pelvis[1]), px(knee[0], knee[1]), col); Step.line(px(knee[0], knee[1]), px(ankle[0], ankle[1]), col);
    Step.line(px(ankle[0], ankle[1]), px(foot.x + 2.4, foot.z), col); Step.line(px(ankle[0], ankle[1]), px(foot.x - 1, foot.z), col);   // a foot, for show
    Step.dot(px(knee[0], knee[1]), 3, Step.BG, col); Step.dot(px(ankle[0], ankle[1]), 4, foot.planted ? Step.PIN : Step.BG, col);
  }
  Step.line(px(pelvis[0], pelvis[1]), px(body, pelvis[1] + 9.5)); Step.dot(px(body, pelvis[1] + 11.6), 16); Step.dot(px(pelvis[0], pelvis[1]), 4);
  Step.text('dashed: standing hip height', 20, 286);
});
</script>
</body>
</html>
