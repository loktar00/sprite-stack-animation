<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Animated sprite stack</title>
<style>
  html, body { margin: 0; height: 100%; background: #17131c; color: #8d8399; font: 13px/1.5 system-ui, "Segoe UI", Helvetica, Arial, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; }
  canvas { display: block; image-rendering: pixelated; }
  p { margin: 8px 16px; text-align: center; }
  a { color: #c9bfd6; }
</style>
</head>
<body>
<canvas id="c" width="640" height="360"></canvas>
<p id="note">Canvas 2D only: every slice is one drawImage from PNG strips. Space pauses.
  Views: <a href="?view=stack">stack</a> <a href="?view=spread">spread</a> <a href="?view=rig">rig</a> <a href="?view=bones">bones</a> <a href="?wide">wide</a> <a href="?">loop</a>.
  Characters: <a href="?">explorer</a> <a href="?char=robot">robot</a></p>
<script src="js/stack.js"></script>
<script src="js/rig.js"></script>
<script>
  // Which character: character.js and art/ in this folder, or with ?char=<name> the ones in examples/<name>/.
  // The scripts are loaded in order: the character, its strip list, then the demo.
  (function () {
    const name = (new URLSearchParams(location.search).get('char') || '').replace(/[^a-z0-9_-]/gi, '');
    const base = window.CHARACTER_BASE = name ? 'examples/' + name + '/' : '';
    const files = [base + 'character.js', base + 'art/parts.js', 'js/demo.js'];
    (function next() {
      if (!files.length) return;
      const s = document.createElement('script'); s.src = files.shift(); s.onload = next;
      s.onerror = function () { document.getElementById('note').textContent = 'Could not load ' + s.src + '. Build the art first: node tools/build-art.js ' + (name ? 'examples/' + name : ''); };
      document.body.appendChild(s);
    })();
  })();
</script>
</body>
</html>
